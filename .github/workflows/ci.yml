name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assirik_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assirik_test?schema=public
      AUTH_SECRET: ci-test-secret-32-bytes-long-string-aaaaaa
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_WHATSAPP_NUMBER: "221775495314"
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: demo
      CLOUDINARY_API_KEY: ci
      CLOUDINARY_API_SECRET: ci
      STRIPE_SECRET_KEY: sk_test_ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm tsc --noEmit

      - name: Prisma migrate (test DB)
        run: pnpm prisma db push --skip-generate

      - name: Build
        run: pnpm build

      - name: Upload .next as artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 7
