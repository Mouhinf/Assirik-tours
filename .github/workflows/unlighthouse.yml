name: Lighthouse audit (Unlighthouse)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  audit:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Unlighthouse
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.PRODUCTION_URL }}
        run: bash scripts/audit-unlighthouse.sh

      - uses: actions/upload-artifact@v4
        with:
          name: unlighthouse-report
          path: reports/unlighthouse
          retention-days: 14
